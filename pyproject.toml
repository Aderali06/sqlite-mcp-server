[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server connecting LLM clients to local SQLite databases with strict read-only security."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aderali06" }
]
urls = { Homepage = "https://github.com/Aderali06/sqlite-mcp-server", Repository = "https://github.com/Aderali06/sqlite-mcp-server.git", Issues = "https://github.com/Aderali06/sqlite-mcp-server/issues" }
keywords = [
    "mcp",
    "model-context-protocol",
    "sqlite",
    "claude",
    "cursor",
    "llm",
    "database",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
sqlite-mcp-server = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v"
